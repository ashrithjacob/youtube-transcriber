[project]
name = "yt-transcriber"
version = "0.1.0"
description = "Transcribe YouTube videos locally with NVIDIA Parakeet TDT (ONNX)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2025.1.1",
    "onnx-asr[cpu,hub]>=0.12.0",
    "imageio-ffmpeg>=0.5.1",
]

[project.scripts]
yt-transcriber = "yt_transcriber.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yt_transcriber"]
